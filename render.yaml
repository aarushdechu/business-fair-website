services:
  - type: web
    name: business-fair-website-live
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sketchy-orders
          property: connectionString
      - key: STAFF_PIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://a-sketchy-business.onrender.com

databases:
  - name: sketchy-orders
    plan: free
    databaseName: sketchy_orders
