services:
  - type: web
    name: business-fair-website-live
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sketchy-orders
          property: connectionString
      - key: STAFF_PIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: sketchy-orders
    plan: free
    databaseName: sketchy_orders
